<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3D Solar System — RandomTyms</title>
  <meta name="description" content="Fly to the planets. Tap a world, then watch the Lokesh & Varsha Space Secrets short." />

  <!-- Open Graph / social share preview (WhatsApp, Telegram, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://randomtyms.github.io/solar/">

  <meta property="og:description" content="Fly to the planets. Tap a world, then watch the Lokesh & Varsha Space Secrets short. Free, no ads, no login.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="3D Solar System — RandomTyms">
  <meta name="twitter:description" content="Fly to the planets. Tap a world, then watch the Lokesh & Varsha Space Secrets short.">
  <meta name="twitter:image" content="https://randomtyms.github.io/solar/solar-preview.jpg">
  <style>
    :root {
      --bg: #07070b;
      --surface: rgb(12 12 18 / 0.82);
      --fg: #f4f1ea;
      --muted: #9a96a3;
      --accent: #e8e4dc;
      --accent-fg: #07070b;
      --line: rgb(244 241 234 / 0.12);
      --radius: 20px;
      --font: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#view {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    #ui > * { pointer-events: auto; }
    header.top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    header.top h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    header.top p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    header.top a {
      color: var(--muted);
      text-decoration: none;
    }
    header.top a:hover { color: var(--fg); }
    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: right;
      max-width: 14rem;
    }
    .bottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--line);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      background: #e11d48;
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 0.88rem;
      text-decoration: none;
    }
    .watch[hidden] { display: none; }
    .planets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px;
      scrollbar-width: none;
    }
    .planets::-webkit-scrollbar { display: none; }
    .chip {
      appearance: none;
      border: 0;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--line);
      color: var(--fg);
      font: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      min-height: 44px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .chip .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: none;
    }
    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bar button, .bar .watch {
      appearance: none;
      border: 0;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--line);
      color: var(--fg);
      font: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      min-height: 44px;
      min-width: 44px;
      padding: 0 16px;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 0;
      text-decoration: none;
    }
    .bar button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: none;
    }
    .bar .watch {
      background: #e11d48;
      color: #fff;
      box-shadow: none;
    }
    button:focus-visible, .watch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @media (max-width: 640px) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="view" role="img" aria-label="3D solar system"></canvas>
  <div id="ui">
    <header class="top">
      <div>
        <h1>Our Solar System</h1>
        <p><a href="../">randomtyms</a></p>
      </div>
      <p class="hint">Tap a planet, then watch the short.</p>
    </header>
    <div class="bottom">
      <div class="card">
        <h2 id="fact-name">Sun</h2>
        <p id="fact-blurb">The Sun is a star — a giant ball of hot, glowing gas. It keeps every planet moving around it.</p>
        <a id="fact-watch" class="watch" href="https://www.youtube.com/watch?v=n9G_sUEH5_g" target="_blank" rel="noopener">Watch Sun</a>
      </div>
      <div class="planets" id="chips" role="tablist" aria-label="Planets"></div>
      <div class="bar">
        <button type="button" id="toggle" aria-pressed="false">Pause</button>
        <button type="button" class="spd" data-speed="1" aria-pressed="false">Slow</button>
        <button type="button" class="spd" data-speed="3" aria-pressed="true">Medium</button>
        <button type="button" class="spd" data-speed="10" aria-pressed="false">Fast</button>
        <button type="button" id="home">See all</button>
        <a class="watch" href="https://www.youtube.com/watch?v=g-VeaFSHwZk" target="_blank" rel="noopener">Planet song</a>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./solar-system.js?v=3"></script>
</body>
</html>
