<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Our World — RandomTyms</title>
  <meta name="description" content="Spin the globe. Tap a country to learn its capital, language, and one kid-friendly fact. Free, no ads, no login." />
  <meta name="theme-color" content="#07070b" />
  <link rel="canonical" href="https://randomtyms.github.io/world/" />

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://randomtyms.github.io/world/">
  <meta property="og:title" content="Our World — RandomTyms">
  <meta property="og:description" content="Spin the globe. Tap a country to learn its capital. English and Tamil. Free, no ads, no login.">
  <meta property="og:image" content="https://randomtyms.github.io/world/world-preview.jpg?v=2">
  <meta property="og:site_name" content="RandomTyms">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Our World — RandomTyms">
  <meta name="twitter:description" content="Spin the globe. Tap a country to learn its capital. English and Tamil.">
  <meta name="twitter:image" content="https://randomtyms.github.io/world/world-preview.jpg?v=2">
  <style>
    :root {
      --bg: #07070b;
      --surface: rgb(12 12 18 / 0.82);
      --fg: #f4f1ea;
      --muted: #9a96a3;
      --accent: #e8e4dc;
      --accent-fg: #07070b;
      --line: rgb(244 241 234 / 0.12);
      --ok: #b7d7b0;
      --bad: #e8b4b4;
      --radius: 20px;
      --font: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#view {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    #ui > * { pointer-events: auto; }
    header.top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    header.top h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    header.top p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    header.top a {
      color: var(--muted);
      text-decoration: none;
    }
    header.top a:hover { color: var(--fg); }
    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: right;
      max-width: 14rem;
      line-height: 1.35;
    }
    .bottom {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--line);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .card .meta {
      margin: 6px 0 0;
      color: var(--fg);
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .card .status { margin: 8px 0 0; font-size: 0.88rem; font-weight: 800; }
    .card .status.ok { color: var(--ok); }
    .card .status.bad { color: var(--bad); }
    .next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px;
      scrollbar-width: none;
    }
    .chips[hidden] { display: none !important; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      appearance: none;
      border: 0;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--line);
      color: var(--fg);
      font: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      min-height: 44px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .chip .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: none;
    }
    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bar button {
      appearance: none;
      border: 0;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--line);
      color: var(--fg);
      font: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      min-height: 44px;
      min-width: 44px;
      padding: 0 16px;
      border-radius: 14px;
      cursor: pointer;
    }
    .bar button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: none;
    }
    .bar .quiz-feat {
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .bar .quiz-feat img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #1a1a22;
    }
    .who-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 0 0;
    }
    .who-line img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex: none;
      background: #1a1a22;
    }
    .who-line .faces {
      display: flex;
      flex: none;
    }
    .who-line .faces img {
      width: 32px;
      height: 32px;
    }
    .who-line .faces img + img {
      margin-left: -8px;
    }
    .who-line span {
      min-width: 0;
    }
    .who-line b {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }
    .card .who-line .meta,
    .card .who-line .status,
    .card .who-line .say {
      margin: 2px 0 0;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--fg);
    }
    .card .who-line .say { color: var(--muted); font-weight: 600; }
    @media (max-width: 640px) {
      .hint { display: none; }
      .bar { justify-content: center; }
    }
  </style>
</head>
<body>
  <canvas id="view" role="img" aria-label="3D world globe"></canvas>
  <div id="ui">
    <header class="top">
      <div>
        <h1 id="title">Our World</h1>
        <p><a href="https://randomtyms.github.io/" target="_blank" rel="noopener">RandomTyms</a></p>
      </div>
      <p class="hint" id="hint">Tap a country to learn its capital.</p>
    </header>
    <div class="bottom">
      <section class="card" id="card" aria-live="polite">
        <h2 id="fact-name">India</h2>
        <p class="meta" id="fact-meta">Capital: New Delhi</p>
        <p class="meta" id="fact-lang">Language: Hindi, English</p>
        <p id="fact-blurb">India is home to tigers, elephants, and the Himalayas — the world's highest mountains.</p>
      </section>
      <div class="chips" id="chips" role="tablist" aria-label="Regions"></div>
      <div class="bar">
        <button type="button" id="toggle" aria-pressed="false">Pause</button>
        <button type="button" class="spd" data-speed="1" aria-pressed="false">Slow</button>
        <button type="button" class="spd" data-speed="3" aria-pressed="true">Medium</button>
        <button type="button" class="spd" data-speed="10" aria-pressed="false">Fast</button>
        <button type="button" id="home">See all</button>
        <button type="button" id="quiz" class="quiz-feat" aria-pressed="false">
          <img src="./lokesh.png" width="22" height="22" alt="">
          <img src="./varsha.png" width="22" height="22" alt="">
          L & V Quiz
        </button>
        <button type="button" id="lang">தமிழ்</button>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm",
      "three-conic-polygon-geometry": "https://cdn.jsdelivr.net/npm/three-conic-polygon-geometry@2.1.3/+esm"
    }
  }
  </script>
  <script type="module" src="./world.js?v=2"></script>
</body>
</html>
