<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Dharma — Ask Lokesh & Varsha | RandomTyms</title>
  <style>
    /* Complete CSS styling for Digital Dharma interface and dark mode support */
    :root {
      --bg-color: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --primary-color: #7c3aed;
      --primary-hover: #6d28d9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --teacher-bg: #fffdf5;
      --teacher-border: #fef3c7;
      --teacher-accent: #d97706;
      --license-bg: #f8fafc;
      --license-border: #e2e8f0;
      --chip-bg: #ffffff;
      --chip-border: #e2e8f0;
      --chip-text: #475569;
      --chip-hover-bg: #f8fafc;
      --user-msg-bg: #7c3aed;
      --user-msg-text: #ffffff;
      --bot-msg-bg: #f8fafc;
      --bot-msg-border: #e2e8f0;
      --avatar-bg: #f472b6;
      --footer-bg: #f8fafc;
      --footer-border: #e2e8f0;
      --footer-heading: #1e3a8a;
      --privacy-bg: #f1f5f9;
      --privacy-border: #64748b;
      --link-color: #2563eb;
    }
    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --primary-color: #a78bfa;
      --primary-hover: #c084fc;
      --card-bg: #1e293b;
      --card-border: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
      --teacher-bg: #1e1b4b;
      --teacher-border: #2e1065;
      --teacher-accent: #fbbf24;
      --license-bg: #1e293b;
      --license-border: #334155;
      --chip-bg: #1e293b;
      --chip-border: #334155;
      --chip-text: #cbd5e1;
      --chip-hover-bg: #334155;
      --user-msg-bg: #a78bfa;
      --user-msg-text: #0f172a;
      --bot-msg-bg: #1e293b;
      --bot-msg-border: #334155;
      --footer-bg: #0b0f19;
      --footer-border: #1e293b;
      --footer-heading: #60a5fa;
      --privacy-bg: #1e293b;
      --privacy-border: #475569;
      --link-color: #60a5fa;
    }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
    .companion-workspace { border: 1px solid var(--card-border); border-radius: 12px; background-color: var(--card-bg); padding: 24px 20px; margin: 16px; box-shadow: var(--shadow); }
    .query-chips-wrapper { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .query-chip { background-color: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .site-footer { margin-top: auto; background-color: var(--footer-bg); border-top: 1px solid var(--footer-border); padding: 40px 20px; }
  </style>
</head>
<body>
    <nav class="nav-bar">
      <div>Digital Dharma</div>
      <button id="themeToggle" aria-label="Toggle dark mode">🌓</button>
    </nav>
    <section class="companion-workspace">
      <h1>Ask Lokesh & Varsha — Digital Dharma</h1>
      <p>Interactive Cyber Safety & Ethics Companion (Grades 4–8)</p>
      <div class="query-chips-wrapper">
        <button class="query-chip" onclick="triggerQuestion('Why should I tell the truth?')">Why should I tell the truth?</button>
        <button class="query-chip" onclick="triggerQuestion('How can I tell if a link is fake?')">How can I tell if a link is fake?</button>
      </div>
    </section>
    <footer class="site-footer">
      <p>© RandomTyms — Digital Dharma Series.</p>
    </footer>
  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        if (document.documentElement.getAttribute('data-theme') !== 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      });
    }
    function triggerQuestion(q) { alert(q); }
  </script>
</body>
</html>
