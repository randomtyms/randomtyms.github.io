<!-- Native Home Button inside Top Header -->
<script>
  (function() {
    function injectHome() {
      if (document.getElementById('randomtyms-home-btn')) return;
      var target = document.querySelector('header .flex.items-center.gap-2') || document.querySelector('header');
      if (target) {
        var btn = document.createElement('a');
        btn.id = 'randomtyms-home-btn';
        btn.href = 'https://randomtyms.github.io';
        btn.title = 'Back to randomtyms.github.io';
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-2px;margin-right:4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home';
        btn.style.cssText = 'display:inline-flex;align-items:center;padding:4px 10px;background:#f3e8ff;color:#581c87;font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:700;border-radius:9999px;text-decoration:none;border:1px solid #d8b4fe;margin-right:4px;flex-shrink:0;';
        target.insertBefore(btn, target.firstChild);
      } else {
        setTimeout(injectHome, 200);
      }
    }
    window.addEventListener('DOMContentLoaded', injectHome);
    setTimeout(injectHome, 300);
    setTimeout(injectHome, 800);
  })();
</script>
