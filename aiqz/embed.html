<style>
:root{--paper:#FBF3E1;--ink:#2B2E4A;--gold:#C9932F;--mari:#F5A623;--mari-d:#C9791A;--teal:#1F8A70;--teal-d:#166350;--terra:#D6553F;--border:#E6D9B8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',sans-serif;padding-bottom:30px}
body.is-embedded{background:transparent!important;padding-bottom:0!important}
body.is-embedded header,body.is-embedded .hero{display:none!important}
body.is-embedded .quiz-box{margin:6px auto!important;width:100%!important;max-width:100%!important;box-shadow:none!important}
header{position:sticky;top:0;background:rgba(251,243,225,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--border);padding:10px 16px;z-index:10}
.header-wrap{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.1em}.brand-title span{color:var(--mari)}
.hero{text-align:center;max-width:960px;margin:12px auto 8px;padding:0 16px}
.hero h1{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(1.3em,3vw,2em);margin:8px 0 4px}h1 span{color:var(--mari-d)}
.hero p{max-width:700px;margin:0 auto 10px;color:rgba(43,46,74,.8);font-size:.9em}
.quiz-box{background:var(--paper);border:3px dashed var(--gold);width:94%;max-width:960px;margin:12px auto;padding:18px 20px;border-radius:20px;text-align:center;box-shadow:0 5px 0 rgba(201,147,47,.15)}
.badge{display:inline-block;background:var(--teal);color:#fff;font-family:'Baloo 2',cursive;font-weight:700;border-radius:999px;padding:3px 12px;font-size:.78em;margin-bottom:6px}
.topic-master{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0 14px;padding:12px;background:#fff;border:2px solid var(--border);border-radius:14px}
.topic-btn{border:2px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.82em;cursor:pointer;text-align:left;line-height:1.25;transition:all .15s}
.topic-btn:hover{border-color:var(--mari);background:#FFF8EA}
.topic-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.topic-btn small{display:block;font-weight:600;opacity:.7;font-size:.75em;margin-top:2px}
.btn{border:none;border-radius:999px;padding:11px 22px;font-family:'Baloo 2',cursive;font-weight:800;font-size:1.1em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn-mari{background:var(--mari);color:#fff;box-shadow:0 3px 0 var(--mari-d)}
.btn:disabled{background:#E0DACB;color:#9a927a;box-shadow:none;cursor:not-allowed}
.topbar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.score-chip{background:var(--teal);color:#fff;border-radius:999px;padding:4px 12px;font-size:.8em}
.progress-track{height:8px;background:#EFE3C4;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mari),var(--teal));transition:width .3s}
.question{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.35em;text-align:left;margin-bottom:12px;line-height:1.35}
.options{display:grid;gap:8px}
@media(min-width:700px){.options{grid-template-columns:1fr 1fr}}
.option{display:flex;gap:10px;align-items:center;padding:10px 14px;border:2px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-weight:600;text-align:left;min-height:48px}
.option::before{content:attr(data-letter);width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;flex:0 0 auto}
.option:hover{border-color:var(--mari);background:#FFF8EA}
.option.correct{background:#E4F5EC;border-color:var(--teal)}.option.wrong{background:#FBE6E1;border-color:var(--terra)}
.overlay{position:fixed;inset:0;background:rgba(43,46,74,.65);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.card{background:var(--paper);border:3px dashed var(--gold);border-radius:18px;padding:18px;max-width:460px;width:100%;text-align:center;max-height:90vh;overflow-y:auto;position:relative}
.close{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);background:#fff;cursor:pointer;font-weight:800}
</style>
</head>
<body>
<header><div class="header-wrap"><div class="brand-title">RandomTyms <span>AIQZ</span></div><div style="font-size:.75em;opacity:.7">embed.html</div></div></header>
<div class="hero">
<img id="hero-banner" src="https://raw.githubusercontent.com/randomtyms/randomtyms-worksheets/main/assets/banner.webp" 
     onerror="this.src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiTdfIS9EtelAluBmKXDA0d8BgYd9l1-Wx_HSEhGXvrqQ-3JnpoRpoxQ76QNxajH2eZyA3msoLb4hBbv2X3v1vo4AfNwnoaey5GJZkXmYXA4ci1x9vsY9i3_dJDOcb3xMwjwnoSw4DW7rXIkHh6NL3LQsSy8dV8cq9Wrt08J8HB2QExxBuMx13kaO8mWyc/w640-h426/1000239767.png'"
     alt="RandomTyms Lokesh and Varsha" style="max-width:580px;width:100%;height:auto;border-radius:18px;border:2px solid var(--border);box-shadow:0 4px 12px rgba(201,147,47,.15)">
<h1>Class 6 Science <span>Topic-wise Quiz</span></h1>
<p>Pick a topic below — URL updates automatically (?range=) and quiz loads only that slice from the master CSV.</p>
</div>

<div class="quiz-box" id="setup-box">
<div class="badge">📚 Complete Questions · All Topics</div>
<div class="topic-master" id="topic-master">

<p id="load-status" style="font-weight:700;color:var(--teal);margin:6px 0">Loading master CSV...</p>
<button class="btn btn-mari" id="start-btn" disabled>Loading... ⏳</button>
<p style="font-size:.75em;opacity:.6;margin-top:8px;word-break:break-all" id="url-preview"></p>
</div>
</div>

<div class="quiz-box" id="quiz-box" style="display:none;">
<div class="topbar"><span id="progress">Q 1 / 10</span><span class="score-chip" id="score">Score: 0</span></div>
<div class="progress-track"><div class="progress-fill" id="fill"></div></div>
<div class="question" id="q-text"></div>
<div class="options" id="opts"></div>
</div>

<div class="overlay" id="feedback-overlay" style="display:none;"><div class="card">
<div style="position:relative;display:inline-block;margin:0 auto 10px;max-width:100%">
<img id="feedback-img" src="https://raw.githubusercontent.com/randomtyms/randomtyms-worksheets/main/assets/correct.webp"
     onerror="this.src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhYqmmXNTl42Ctra6TCGYVBaGMXXc-LqssnCG346uV5c_25YKB_7-ejcqkjBRrzZzaa9xI21xu34qEiwCK4QaTREDJ6pt1Iir8v_6buj4PElllKNd-yjQbG2YpBT_6HuhZkZpq-3j9_rM4IPzC3L2re8wAlMzqm3lczskTZ1DOM0IdpShuqAULycjrMhzg/s1536/1000233281.png'"
     alt="feedback" style="display:block;max-height:260px;width:auto;max-width:100%;object-fit:contain;margin:0 auto">
<div id="feedback-banner" style="position:absolute;top:15%;left:22%;right:24%;height:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#D6553F;font-family:'Baloo 2',cursive;font-weight:800;line-height:1.15"></div>
</div>
<div id="fb-text" style="font-family:'Baloo 2',cursive;font-weight:800;font-size:1.2em;margin-bottom:10px"></div><button class="btn btn-mari" id="continue-btn">Continue ➜</button></div></div>
<div class="overlay" id="final-overlay" style="display:none;"><div class="card"><button class="close" id="final-close">✕</button>
<div style="position:relative;display:inline-block;margin:0 auto 10px;max-width:100%">
<img id="final-img" src="https://raw.githubusercontent.com/randomtyms/randomtyms-worksheets/main/assets/correct.webp"
     onerror="this.src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhYqmmXNTl42Ctra6TCGYVBaGMXXc-LqssnCG346uV5c_25YKB_7-ejcqkjBRrzZzaa9xI21xu34qEiwCK4QaTREDJ6pt1Iir8v_6buj4PElllKNd-yjQbG2YpBT_6HuhZkZpq-3j9_rM4IPzC3L2re8wAlMzqm3lczskTZ1DOM0IdpShuqAULycjrMhzg/s1536/1000233281.png'"
     alt="final" style="display:block;max-height:260px;width:auto;max-width:100%;margin:0 auto">
<div id="final-banner" style="position:absolute;top:15%;left:22%;right:24%;height:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#D6553F;font-family:'Baloo 2',cursive;font-weight:800"></div>
</div>
<div id="final-score" style="font-family:'Baloo 2',cursive;font-weight:800;font-size:1.25em;margin-bottom:8px"></div><div id="review" style="max-height:180px;overflow-y:auto;text-align:left;border-top:2px dashed var(--border);padding-top:8px;margin-bottom:10px"></div><button class="btn btn-mari" id="restart-btn">Back to Topics 🔄</button></div></div>

<script>
let DEFAULT_CSV_URL = "https://raw.githubusercontent.com/randomtyms/randomtyms-worksheets/main/Class%206/class6_science_quiz.csv";

function normalizeUrl(u){
  if(!u) return u;
  let url=u.trim();
  // fix unencoded spaces first
  url = url.replace(/ /g, '%20');
  if(url.includes('github.com/')&&url.includes('/blob/')){
    url = url.replace('github.com/','raw.githubusercontent.com/').replace('/blob/','/');
  }
  // If url still has double-encoded %2520 -> decode once
  try { 
    // decode only if it contains %25
    if(url.includes('%25')) url = decodeURIComponent(url);
  } catch(e){}
  return url;
}
function getCsvUrlFromParams(){
  let params=new URLSearchParams(location.search);
  let csvParam=params.get('csv');
  if(csvParam){
    try { csvParam = decodeURIComponent(csvParam); } catch(e){}
    // csvParam might itself be double-encoded (Class%25206) -> decode again if needed
    try { if(csvParam.includes('%25')) csvParam = decodeURIComponent(csvParam); } catch(e){}
    return normalizeUrl(csvParam);
  }
  return DEFAULT_CSV_URL;
}
let CSV_URL = getCsvUrlFromParams();
function parseLine(line){
  let res=[],cur='',q=false;
  for(let i=0;i<line.length;i++){let c=line[i]; if(c=='"'){ if(q&&line[i+1]=='"'){cur+='"';i++;} else q=!q; } else if(c==','&&!q){res.push(cur);cur='';} else cur+=c; }
  res.push(cur); return res.map(s=>s.trim());
}
function parseCSV(text){
  let lines=text.split(/\r?\n/).filter(l=>l.trim());
  let out=[];
  for(let l of lines){
    let p=parseLine(l);
    if(p.length<6) continue;
    if(p.length>6){ let cf=p[p.length-1]; let opts=p.slice(p.length-5,p.length-1); let qj=p.slice(0,p.length-5).join(', '); p=[qj].concat(opts).concat([cf]); }
    let cn=parseInt(p[5],10); if(isNaN(cn)||cn<1||cn>4) continue;
    out.push({q:p[0],options:[p[1],p[2],p[3],p[4]],correct:cn});
  }
  return out;
}
function shuffle(a){ let b=a.slice(); for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }

let master=[],active=[],idx=0,score=0,wait=false,missed=[],selectedRange="1-176",selectedLabel="All Topics";
const IMG_WRONG="https://raw.githubusercontent.com/randomtyms/randomtyms-worksheets/main/assets/wrong.webp";
const IMG_WRONG_FB="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjHOA-KW2g8ysuNUbTHH6_lTgj7QNBgXY6tt19p94F9dVs6ZPU16O8czHv7MjS1_qwZJJRPBmPyOpHgaGxv3TSZrRV6ucB8ajXkUGRawAEQczObL5j0NYw7x8SC_MirQjTcvF0egpXxwxXHeP6Jgk_yo9xyO6KXbR0za1d6fXUez8vi2wQKlI5IWvHHXN0/s1920/1000239625.png";
const IMG_CORRECT="https://raw.githubusercontent.com/randomtyms/randomtyms-worksheets/main/assets/correct.webp";
const IMG_CORRECT_FB="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhYqmmXNTl42Ctra6TCGYVBaGMXXc-LqssnCG346uV5c_25YKB_7-ejcqkjBRrzZzaa9xI21xu34qEiwCK4QaTREDJ6pt1Iir8v_6buj4PElllKNd-yjQbG2YpBT_6HuhZkZpq-3j9_rM4IPzC3L2re8wAlMzqm3lczskTZ1DOM0IdpShuqAULycjrMhzg/s1536/1000233281.png";

const topicMaster=document.getElementById('topic-master'), statusEl=document.getElementById('load-status'), startBtn=document.getElementById('start-btn'), urlPreview=document.getElementById('url-preview');
const setupBox=document.getElementById('setup-box'), quizBox=document.getElementById('quiz-box');
const progressEl=document.getElementById('progress'), scoreEl=document.getElementById('score'), fillEl=document.getElementById('fill'), qText=document.getElementById('q-text'), optsEl=document.getElementById('opts');
const fbOverlay=document.getElementById('feedback-overlay'), fbText=document.getElementById('fb-text'), contBtn=document.getElementById('continue-btn'), fbImg=document.getElementById('feedback-img'), fbBanner=document.getElementById('feedback-banner');
const finalOverlay=document.getElementById('final-overlay'), finalScoreEl=document.getElementById('final-score'), reviewEl=document.getElementById('review'), restartBtn=document.getElementById('restart-btn'), closeBtn=document.getElementById('final-close'), finalImg=document.getElementById('final-img'), finalBanner=document.getElementById('final-banner');

function updateUrlParams(){
  let params=new URLSearchParams(location.search);
  params.set('csv', CSV_URL);
  params.set('range', selectedRange);
  params.set('topic', selectedLabel);
  // preserve embed/autostart if they were present
  if(isEmbed) params.set('embed','1');
  if(isAutostart) params.set('autostart','1');
  let newUrl = location.pathname + '?' + params.toString();
  history.replaceState(null,'',newUrl);
  if(urlPreview) urlPreview.textContent = location.origin + newUrl;
}

function setActiveButton(range){
  document.querySelectorAll('.topic-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.range===range);
  });
}

function sliceByRange(items, rangeStr){
  if(!rangeStr) return items;
  let [s,e]=rangeStr.split('-').map(n=>parseInt(n,10));
  if(isNaN(s)||isNaN(e)) return items;
  return items.slice(s-1, e);
}

function handleTopicClick(e){
  let btn=e.target.closest('.topic-btn');
  if(!btn) return;
  selectedRange=btn.dataset.range;
  selectedLabel=btn.dataset.label;
  setActiveButton(selectedRange);
  updateUrlParams();
  if(master.length){
    let sliced=sliceByRange(master, selectedRange);
    statusEl.textContent = `${selectedLabel}: ${sliced.length} questions ready (Q${selectedRange})`;
    startBtn.textContent=`Start ${selectedLabel} Quiz 🚀 (${sliced.length} Qs)`;
    startBtn.disabled=false;
  }
}

topicMaster.addEventListener('click', handleTopicClick);

// Initial load - handle embed, autostart, range, topic, csv
let initParams=new URLSearchParams(location.search);
let initRange=initParams.get('range') || "1-176";
selectedRange=initRange;
let initLabel=initParams.get('topic') || "All Topics";
selectedLabel=initLabel;
let isEmbed = initParams.get('embed')==='1' || initParams.get('embed')==='true';
let isAutostart = initParams.get('autostart')==='1' || initParams.get('start')==='1';
if(isEmbed){ document.body.classList.add('is-embedded'); }
setActiveButton(selectedRange);

fetch(normalizeUrl(CSV_URL)).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); }).then(t=>{
  master=parseCSV(t);
  let sliced=sliceByRange(master, selectedRange);
  statusEl.textContent = `${selectedLabel}: ${sliced.length} questions loaded (Q${selectedRange})`;
  startBtn.textContent=`Start ${selectedLabel} Quiz 🚀 (${sliced.length} Qs)`;
  startBtn.disabled=false;
  updateUrlParams();
  if(isAutostart){ startQuiz(); }
}).catch(err=>{
  statusEl.textContent="Failed to load CSV: "+err.message;
  statusEl.style.color="#D6553F";
});

function startQuiz(){
  let sliced=sliceByRange(master, selectedRange);
  active=shuffle(sliced); idx=0; score=0; missed=[];
  setupBox.style.display='none'; quizBox.style.display='block'; render();
}
function render(){
  if(idx>=active.length){ showFinal(); return; }
  let q=active[idx];
  progressEl.textContent=`Question ${idx+1} / ${active.length} (${selectedLabel})`;
  scoreEl.textContent=`Score: ${score}`;
  fillEl.style.width=Math.round(idx/active.length*100)+"%";
  qText.textContent=q.q; optsEl.innerHTML='';
  let letters=['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    let b=document.createElement('button'); b.className='option'; b.dataset.letter=letters[i]; b.textContent=opt;
    b.onclick=()=>answer(i+1); optsEl.appendChild(b);
  });
}
function answer(chosen){
  if(wait) return; wait=true;
  let q=active[idx]; let ok=chosen===q.correct;
  optsEl.querySelectorAll('.option').forEach((b,i)=>{ b.style.pointerEvents='none'; if(i+1===q.correct) b.classList.add('correct'); if(i+1===chosen&&!ok) b.classList.add('wrong'); });
  if(ok){ 
    score++; scoreEl.textContent=`Score: ${score}`; 
    fbText.textContent="Correct! 🎉"; fbText.style.color="#1F8A70"; 
    fbBanner.textContent="Correct! 🎉"; 
    if(fbImg){ fbImg.src=IMG_CORRECT; fbImg.onerror=()=>fbImg.src=IMG_CORRECT_FB; }
  }
  else { 
    fbText.textContent="Correct: "+q.options[q.correct-1]; fbText.style.color="#D6553F"; 
    fbBanner.textContent="Oops!";
    if(fbImg){ fbImg.src=IMG_WRONG; fbImg.onerror=()=>fbImg.src=IMG_WRONG_FB; }
    missed.push({q:q.q, chosen:q.options[chosen-1], correct:q.options[q.correct-1], raw:q}); 
  }
  fbOverlay.style.display='flex';
}
contBtn.onclick=()=>{ fbOverlay.style.display='none'; wait=false; idx++; render(); };
function showFinal(){
  quizBox.style.display='none';
  let pct=Math.round(score/active.length*100);
  finalScoreEl.textContent=`${selectedLabel}: You scored ${score}/${active.length} (${pct}%)`;
  if(pct>=80){
    if(finalImg){ finalImg.src=IMG_CORRECT; finalImg.onerror=()=>finalImg.src=IMG_CORRECT_FB; }
    if(finalBanner) finalBanner.textContent="Congrats!";
  } else {
    if(finalImg){ finalImg.src=IMG_WRONG; finalImg.onerror=()=>finalImg.src=IMG_WRONG_FB; }
    if(finalBanner) finalBanner.textContent="Keep practicing!";
  }
  if(missed.length===0){ reviewEl.innerHTML="<p style='text-align:center;color:#1F8A70;font-weight:700'>🎉 100% — All Correct!</p>"; }
  else {
    let h=`<div style='font-weight:700;text-align:center;margin-bottom:6px'>Mistakes (${missed.length})</div>`;
    missed.forEach(m=>{ h+=`<div style='background:#fff;border:1.5px solid #E6D9B8;border-radius:8px;padding:8px;margin-bottom:6px;font-size:.85em'><div style='font-weight:700'>${m.q}</div><div style='color:#D6553F'>Your: ${m.chosen}</div><div style='color:#1F8A70'>Correct: ${m.correct}</div></div>`; });
    reviewEl.innerHTML=h;
  }
  finalOverlay.style.display='flex';
}
startBtn.onclick=startQuiz;
restartBtn.onclick=()=>{ finalOverlay.style.display='none'; setupBox.style.display='block'; };
